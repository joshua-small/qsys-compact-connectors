name: Compact Connectors contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.112'
      - run: dotnet run --project tests/Portable/SnapRulesTests.csproj -c Release --artifacts-path artifacts/portable-tests
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.112'
      - run: dotnet run --project tests/GeometryTests.csproj -c Release --artifacts-path artifacts/geometry-tests
